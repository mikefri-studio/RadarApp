name: Mise a jour automatique des radars

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger CSV officiels + fusionner
        run: |
          python3 << 'PY'
          import urllib.request, json, csv, io, os

          def get_json(url):
              with urllib.request.urlopen(url) as r:
                  return json.loads(r.read())

          def get_raw(url):
              for enc in ('utf-8-sig', 'latin-1', 'cp1252'):
                  try:
                      return urllib.request.urlopen(url).read().decode(enc)
                  except Exception:
                      continue
              return None

          def sniff_reader(raw):
              first = raw.splitlines()[0] if raw else ''
              delim = ';' if first.count(';') > first.count(',') else ','
              return csv.DictReader(io.StringIO(raw), delimiter=delim), first

          def find(fields, names):
              for n in names:
                  for f in fields:
                      if f and n in f.lower():
                          return f
              return None

          def clean(v):
              return (v or '').strip()

          out_path = 'app/src/main/assets/radars.csv'

          old_vma = {}
          if os.path.exists(out_path):
              for line in open(out_path, encoding='utf-8').read().splitlines()[1:]:
                  p = line.split(';')
                  if len(p) >= 4 and clean(p[3]):
                      old_vma[clean(p[0])] = clean(p[3])
          print(f'VMA connues dans le fichier actuel : {len(old_vma)}')

          radars = {}

          # Source A : liste recente (dec 2025) avec VMA
          da = get_json('https://www.data.gouv.fr/api/1/datasets/liste-des-radars-fixes-en-france/')
          csvsA = [r for r in da.get('resources', []) if (r.get('format') or '').lower() == 'csv']
          csvsA.sort(key=lambda r: r.get('created_at') or '', reverse=True)
          urlA = csvsA[0]['url'] if csvsA else None
          print(f'Source A : {urlA}')
          if urlA:
              rawA = get_raw(urlA)
              if rawA:
                  readerA, headA = sniff_reader(rawA)
                  fa = readerA.fieldnames or []
                  print(f'En-tete A : {headA[:150]}')
                  c = {'id': find(fa, ['identifiant', 'numero', 'id']),
                       'type': find(fa, ['type']),
                       'date': find(fa, ['mise en service', 'mise_en_service', 'date']),
                       'vit': find(fa, ['vma', 'vitesse']),
                       'lat': find(fa, ['latitude', 'lat']),
                       'lng': find(fa, ['longitude', 'lng', 'long'])}
                  print(f'Colonnes A : {c}')
                  for row in readerA:
                      try:
                          lat = clean(row.get(c['lat'])).replace(',', '.')
                          lng = clean(row.get(c['lng'])).replace(',', '.')
                          if not lat or not lng: continue
                          fl, flo = float(lat), float(lng)
                          if fl == 0 and flo == 0: continue
                          rid = clean(row.get(c['id'])) or str(len(radars))
                          radars[rid] = {'type': clean(row.get(c['type'])) or 'Radar fixe',
                                         'date': clean(row.get(c['date']))[:16],
                                         'vit': clean(row.get(c['vit'])),
                                         'lat': lat, 'lng': lng}
                      except Exception:
                          continue
          print(f'Apres source A : {len(radars)} radars')

          # Source B : fichier 2018 (feu rouge, troncon, etc.)
          db = get_json('https://www.data.gouv.fr/api/1/datasets/radars-automatiques/')
          csvsB = [r for r in db.get('resources', []) if (r.get('format') or '').lower() == 'csv']
          urlB = csvsB[0]['url'] if csvsB else None
          print(f'Source B : {urlB}')
          if urlB:
              rawB = get_raw(urlB)
              if rawB:
                  readerB, headB = sniff_reader(rawB)
                  fb = readerB.fieldnames or []
                  cb = {'id': find(fb, ['identifiant', 'numero', 'id']),
                        'type': find(fb, ['type']),
                        'date': find(fb, ['installation', 'mise en service', 'date']),
                        'vit': find(fb, ['vehicules_legers', 'vma', 'vitesse']),
                        'lat': find(fb, ['latitude', 'lat']),
                        'lng': find(fb, ['longitude', 'lng', 'long'])}
                  ajout = 0
                  for row in readerB:
                      try:
                          rid = clean(row.get(cb['id']))
                          if not rid or rid in radars: continue
                          lat = clean(row.get(cb['lat'])).replace(',', '.')
                          lng = clean(row.get(cb['lng'])).replace(',', '.')
                          if not lat or not lng: continue
                          fl, flo = float(lat), float(lng)
                          if fl == 0 and flo == 0: continue
                          radars[rid] = {'type': clean(row.get(cb['type'])) or 'Radar',
                                         'date': clean(row.get(cb['date']))[:16],
                                         'vit': clean(row.get(cb['vit'])),
                                         'lat': lat, 'lng': lng}
                          ajout += 1
                      except Exception:
                          continue
                  print(f'Source B : +{ajout} radars')

          for rid, r in radars.items():
              if not r['vit']:
                  r['vit'] = old_vma.get(rid, '')

          if len(radars) < 100:
              print('ERREUR : trop peu de radars -> fichier NON remplace')
              exit(1)

          header = 'Numero de radar;Type de radar;Date de mise en service;VMA ;Latitude; Longitude\n'
          lignes = [f"{rid};{r['type']};{r['date']};{r['vit']};{r['lat']};{r['lng']}"
                    for rid, r in sorted(radars.items(), key=lambda kv: int(kv[0]) if kv[0].isdigit() else 0)]
          with open(out_path, 'w', encoding='utf-8', newline='\n') as f:
              f.write(header)
              f.write('\n'.join(lignes))
          avec_vma = sum(1 for r in radars.values() if r['vit'])
          print(f'OK : {len(lignes)} radars ecrits, dont {avec_vma} avec VMA')
          PY

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/radars.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "chore: maj auto radars data.gouv.fr (fusion 2025 + 2018 + VMA)"
            git push
          fi
