name: Mise a jour automatique des radars

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger CSV officiel recent + dedoublonner
        run: |
          python3 << 'PY'
          import urllib.request, json, csv, io, os, math

          def get_json(url):
              with urllib.request.urlopen(url) as r:
                  return json.loads(r.read())

          def get_raw(url):
              for enc in ('utf-8-sig', 'latin-1', 'cp1252'):
                  try:
                      return urllib.request.urlopen(url).read().decode(enc)
                  except Exception:
                      continue
              return None

          def sniff_reader(raw):
              first = raw.splitlines()[0] if raw else ''
              delim = ';' if first.count(';') > first.count(',') else ','
              return csv.DictReader(io.StringIO(raw), delimiter=delim), first

          def find(fields, names):
              for n in names:
                  for f in fields:
                      if f and n.lower() in f.lower():
                          return f
              return None

          def clean(v):
              return (v or '').strip()

          def dist_m(a, b):
              lat1, lng1 = a
              lat2, lng2 = b
              R = 6371000
              dlat = math.radians(lat2 - lat1)
              dlng = math.radians(lng2 - lng1)
              x = math.sin(dlat/2)**2 + math.cos(math.radians(lat1)) * math.cos(math.radians(lat2)) * math.sin(dlng/2)**2
              return R * 2 * math.atan2(math.sqrt(x), math.sqrt(1-x))

          out_path = 'app/src/main/assets/radars.csv'

          # Source officielle récente avec VMA
          data = get_json('https://www.data.gouv.fr/api/1/datasets/liste-des-radars-fixes-en-france/')
          csvs = [r for r in data.get('resources', []) if (r.get('format') or '').lower() == 'csv']
          csvs.sort(key=lambda r: r.get('created_at') or '', reverse=True)

          if not csvs:
              print('Aucun CSV officiel recent trouve')
              exit(1)

          url = csvs[0]['url']
          print(f'Source officielle recente : {url}')

          raw = get_raw(url)
          if not raw:
              print('Impossible de telecharger le CSV')
              exit(1)

          reader, head = sniff_reader(raw)
          fields = reader.fieldnames or []
          print(f'En-tete : {head[:200]}')

          col_id   = find(fields, ['identifiant', 'numero', 'numéro', 'id'])
          col_type = find(fields, ['type'])
          col_date = find(fields, ['mise en service', 'mise_en_service', 'date'])
          col_vma  = find(fields, ['vma', 'vitesse'])
          col_lat  = find(fields, ['latitude', 'lat'])
          col_lng  = find(fields, ['longitude', 'lng', 'long'])

          print(f'Colonnes : id={col_id} type={col_type} date={col_date} vma={col_vma} lat={col_lat} lng={col_lng}')

          radars = []

          for row in reader:
              try:
                  lat = clean(row.get(col_lat)).replace(',', '.')
                  lng = clean(row.get(col_lng)).replace(',', '.')
                  if not lat or not lng:
                      continue

                  fl = float(lat)
                  flo = float(lng)

                  if fl == 0 and flo == 0:
                      continue

                  rid = clean(row.get(col_id)) or str(len(radars) + 1)
                  typ = clean(row.get(col_type)) or 'Radar'
                  dat = clean(row.get(col_date))[:16]
                  vma = clean(row.get(col_vma))

                  nouveau = {
                      'id': rid,
                      'type': typ,
                      'date': dat,
                      'vma': vma,
                      'lat': fl,
                      'lng': flo
                  }

                  # Dédoublonnage spatial : si un radar existe déjà à moins de 60 m, on fusionne
                  doublon = None
                  for r in radars:
                      if dist_m((r['lat'], r['lng']), (fl, flo)) < 60:
                          doublon = r
                          break

                  if doublon:
                      # On garde la VMA si l’un des deux l’a
                      if not doublon['vma'] and vma:
                          doublon['vma'] = vma
                      # On garde le type le plus parlant
                      if doublon['type'] == 'Radar' and typ:
                          doublon['type'] = typ
                  else:
                      radars.append(nouveau)

              except Exception:
                  continue

          if len(radars) < 100:
              print(f'ERREUR : seulement {len(radars)} radars detectes -> fichier NON remplace')
              exit(1)

          header = 'Numero de radar;Type de radar;Date de mise en service;VMA ;Latitude; Longitude\n'
          lignes = []
          for r in radars:
              lignes.append(f"{r['id']};{r['type']};{r['date']};{r['vma']};{r['lat']};{r['lng']}")

          with open(out_path, 'w', encoding='utf-8', newline='\n') as f:
              f.write(header)
              f.write('\n'.join(lignes))

          avec_vma = sum(1 for r in radars if r['vma'])
          print(f'OK : {len(radars)} radars uniques ecrits, dont {avec_vma} avec VMA')
          PY

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/radars.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "chore: maj auto radars officiels dedoublonnes"
            git push
          fi
